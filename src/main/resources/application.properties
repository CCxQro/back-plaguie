# configure your datasource
quarkus.datasource.db-kind = mysql
quarkus.datasource.username = ${QUARKUS_DATASOURCE_USERNAME}
quarkus.datasource.password = ${QUARKUS_DATASOURCE_PASSWORD}
quarkus.datasource.jdbc.url = ${QUARKUS_DATASOURCE_JDBC_URL}

%dev.quarkus.datasource.username = ${QUARKUS_DATASOURCE_USERNAME:root}
%dev.quarkus.datasource.password = ${QUARKUS_DATASOURCE_PASSWORD:12102004}
%dev.quarkus.datasource.jdbc.url = ${QUARKUS_DATASOURCE_JDBC_URL:jdbc:mysql://localhost:3306/PLAGUIE}


# Use a safe default schema strategy outside development/testing.
quarkus.hibernate-orm.schema-management.strategy = update
%dev.quarkus.hibernate-orm.schema-management.strategy = drop-and-create
%test.quarkus.hibernate-orm.schema-management.strategy = update
quarkus.hibernate-orm.sql-load-script = import.sql

# Firebase configuration - path to the service account JSON file downloaded from Firebase Console
firebase.service-account-location = ${FIREBASE_SERVICE_ACCOUNT_LOCATION}
%dev.firebase.service-account-location = src/main/resources/firebase-dev.json


%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:plaguie_test;DB_CLOSE_DELAY=-1;MODE=MySQL

%test.quarkus.hibernate-orm.log.sql=true
%test.quarkus.hibernate-orm.sql-load-script=no-file

# OpenAPI / Swagger UI
quarkus.smallrye-openapi.path=/openapi
quarkus.smallrye-openapi.info-title=back-plaguie API
quarkus.smallrye-openapi.info-version=1.0.0-SNAPSHOT
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui

# CORS configuration
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${QUARKUS_HTTP_CORS_ORIGINS:http://localhost:5173,http://localhost:5174}
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with
quarkus.http.cors.methods=GET, POST, PUT, DELETE, PATCH, OPTIONS

quarkus.log.file.enable=true
quarkus.log.file.path=quarkus.log

# Gemini API (reporte predictivo de plagas)
gemini.api.base-url=${GEMINI_API_BASE_URL:https://generativelanguage.googleapis.com}
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_API_MODEL:gemini-2.0-flash}
gemini.api.timeout-seconds=${GEMINI_API_TIMEOUT_SECONDS:30}

%test.gemini.api.key=test-key
%test.gemini.api.base-url=http://localhost:0
%test.gemini.api.model=gemini-test

# ---- EP-05: SENASICA Kafka ingestion pipeline ----
# Producer: ingestion-files-out -> topic ingestion.files
mp.messaging.outgoing.ingestion-files-out.connector=smallrye-kafka
mp.messaging.outgoing.ingestion-files-out.topic=ingestion.files
mp.messaging.outgoing.ingestion-files-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

# Consumer: ingestion-files-in <- topic ingestion.files
mp.messaging.incoming.ingestion-files-in.connector=smallrye-kafka
mp.messaging.incoming.ingestion-files-in.topic=ingestion.files
mp.messaging.incoming.ingestion-files-in.group.id=ingest-workers
mp.messaging.incoming.ingestion-files-in.value.deserializer=itesm.mx.infrastructure.ingestion.kafka.IngestionFileMessageDeserializer

# Producer: ingestion-progress-out -> topic ingestion.progress
mp.messaging.outgoing.ingestion-progress-out.connector=smallrye-kafka
mp.messaging.outgoing.ingestion-progress-out.topic=ingestion.progress
mp.messaging.outgoing.ingestion-progress-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

# Consumer: ingestion-progress-in <- topic ingestion.progress (for SSE broadcast)
mp.messaging.incoming.ingestion-progress-in.connector=smallrye-kafka
mp.messaging.incoming.ingestion-progress-in.topic=ingestion.progress
mp.messaging.incoming.ingestion-progress-in.group.id=ingestion-sse
mp.messaging.incoming.ingestion-progress-in.value.deserializer=itesm.mx.infrastructure.ingestion.kafka.IngestionProgressEventDeserializer

# Kafka bootstrap (prod: set via env KAFKA_BOOTSTRAP_SERVERS)
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Dev Services for Kafka (auto-broker in dev + test; no manual broker needed)
quarkus.kafka.devservices.enabled=true

# Ingestion pipeline config
ingestion.discovery.connect-timeout-seconds=${INGESTION_DISCOVERY_CONNECT_TIMEOUT:15}
ingestion.discovery.request-timeout-seconds=${INGESTION_DISCOVERY_REQUEST_TIMEOUT:30}